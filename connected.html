<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store connection · Assistaa</title><link rel="icon" type="image/svg+xml" href="/mark.svg"><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 520px at 50% 30%,#12305a 0%,#0B1220 60%,#050912 100%);color:#F3F6FA;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:440px;padding:34px 30px;border-radius:20px;background:#0f1a2e;border:1px solid rgba(0,174,239,.28);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}.logo .m{width:40px;height:40px}.logo .w{height:20px;width:auto}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.ok .badge{background:rgba(34,197,94,.14);color:#86efac}.err .badge{background:rgba(251,191,36,.14);color:#fcd34d}
h1{margin:14px 0 8px;font-size:24px;line-height:1.25}
p{margin:0;color:#a9bcd6}
a{color:#2CC0FF}
.foot{margin-top:22px;font-size:13px;color:#7f93ad}
</style></head>
<body><main class="card" id="card" aria-live="polite">
<div class="logo"><img class="m" src="/logo-mark.svg" alt=""><img class="w" src="/logo-word.svg" alt="Assistaa"></div>
<div class="badge" id="badge"></div>
<h1 id="t"></h1>
<p id="m"></p>
<p class="foot">Questions? <a href="https://wa.me/8801814189999">WhatsApp Assistaa</a></p>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var ok = q.get("s") !== "err";
  var clip = function(v, n, d){ v = (v || "").trim(); return v ? v.slice(0, n) : d; };
  document.getElementById("card").className = "card " + (ok ? "ok" : "err");
  document.getElementById("badge").textContent = ok ? "✓ Connected" : "Needs attention";
  document.getElementById("t").textContent = clip(q.get("t"), 120, ok ? "Your store is connected" : "Something went wrong");
  document.getElementById("m").textContent = clip(q.get("m"), 400, ok ? "You can close this page." : "Try the install link again, or message us.");
  document.title = document.getElementById("t").textContent + " · Assistaa";
})();
</script>
</body></html>
